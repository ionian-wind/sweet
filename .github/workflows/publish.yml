name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ionian-wind packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish packages
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "The NPM_TOKEN repository secret is not configured." >&2
            exit 1
          fi

          npm publish --workspace @ionian-wind/sweet-spec --access public
          npm publish --workspace @ionian-wind/sweet-core --access public
          npm publish --workspace @ionian-wind/sweet-helpers --access public
          npm publish --workspace @ionian-wind/sweet --access public
